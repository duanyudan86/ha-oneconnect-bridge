# 集成默认仅支持华为为 Home Assistant 构建的专属物模型。
# 自定义物模型请自行查阅相关资料，并在本配置文件中显式配置对应子设备的注册信息；由此产生的不可控因素及法律责任由您自行承担。
# 默认配置会注册一个智控灯泡；请将下方 HA 实体占位符替换为实际实体。
# 尊界S800模型示例已注释，如需使用请取消对应注释。

schema: 1
enabled: true
gateway_serial: ""

children:
