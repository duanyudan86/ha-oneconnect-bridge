  # 以下子设备都是华为专为Home Assistant构建的专属物模型，只需配置产品ID、设备类型及HA实体映射
  # 配置其他已支持的 HA 专属物模型时，可复制对应条目并替换实体
  # 自定义包装信息配置错误可能导致云端拒绝（如 15013），请按对应产品资料填写。
  # 对于HA实体和华为服务不对等的情况您可以进行自定义覆盖。

  color_bulb_9mu7:
    product:
      prod_id: 9MU7
      device_type: "119"
      friendly_name: 智控灯泡
      room: 客厅
      services:
        - st: switch
          sid: switch
        - st: brightness
          sid: brightness
          contract:
            min: 1
            max: 100
            step: 1
        - st: cct
          sid: cct
      bindings:
        - sid: switch
          entities: [light.REPLACE_WITH_COLOR_BULB]
        - sid: brightness
          entities: [light.REPLACE_WITH_COLOR_BULB]
        - sid: cct
          entities: [light.REPLACE_WITH_COLOR_BULB]

